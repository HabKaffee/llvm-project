import lit.formats
import os

config.name = "MultiplyOpt"
config.suffixes = [".ll"]
config.test_format = lit.formats.ShTest()
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = os.path.dirname(__file__)

# Определяем пути к сборке
current_dir = os.path.dirname(__file__)
project_root = os.path.abspath(os.path.join(current_dir, "../../.."))
build_dir = os.path.join(project_root, "build")
lib_dir = os.path.join(build_dir, "lib")
bin_dir = os.path.join(build_dir, "bin")

# Подстановки
if os.path.exists(lib_dir):
    config.substitutions.append(("%llvmshlibdir", lib_dir))
else:
    # Запасной вариант
    config.substitutions.append(("%llvmshlibdir", "/home/ksenia1112/llvm-project/build/lib"))

config.substitutions.append(("%shlibext", ".so"))
config.substitutions.append(("%opt", os.path.join(bin_dir, "opt")))
config.substitutions.append(("%FileCheck", os.path.join(bin_dir, "FileCheck")))

